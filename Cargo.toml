[package]
name = "crabscape"
version = "0.1.0"
edition = "2024"
authors = ["Steven Kauwe"]
description = "A tiny RuneScape-inspired co-op browser game about crabs, written in Rust with Bevy."
publish = false
# `cargo run` starts the game (the workspace also has the headless `crabsim` runner).
default-run = "crabscape"

# The game is the root package. `crates/sim` is the simulation (the game rules with no graphics), which the game
# uses and which also runs headless (`cargo crabsim`); plain `cargo build` / `cargo test` / the wasm build cover the
# game and the simulation. The art tools are the other members: `--workspace` or `-p painter` to include them.
[workspace]
members = ["crates/sim", "crates/painter", "crates/crabrig", "tools/oil-atlas"]
default-members = [".", "crates/sim"]

[features]
# Preview/testing builds only (previews.yml): the moment picker gains a
# CHECKPOINTS section loaded from dev/checkpoints/*.ron. Main and web
# deploys build without it.
dev-checkpoints = ["dep:ron"]

[dependencies]
ron = { version = "0.12", optional = true }

# The game rules. The `bevy` feature makes its types Bevy components/resources.
crabsim = { path = "crates/sim", features = ["bevy"] }
# Bevy with its default features switched off, so only the parts this game
# actually uses get compiled in. That keeps the WebAssembly download small.
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "async_executor",    # runs Bevy's background tasks
    "bevy_asset",        # meshes and materials are "assets"
    "bevy_log",          # info!/warn! messages (the browser console on the web)
    "bevy_winit",        # windows and the event loop (a <canvas> on the web)
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render", # sprites and 2D meshes (our coloured shapes)
    "bevy_mesh",
    "bevy_color",
    "bevy_camera",
    "bevy_image",
    "png",               # decode the crab's parts pictures (loaded from assets/crab/)
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",    # the HUD text
    "default_font",      # a small font baked into the binary, so no font file to load
    "keyboard",
    "mouse",
    "touch",
    "gamepad",
    "bevy_gilrs",        # game controllers (in the browser, through the Gamepad API)
    "webgl2",            # browser backend: WebGL2 works on iPhone Safari / WebKit
    "web",               # browser timers and clocks (does nothing on native)
    "x11",
    "wayland",
    # A size switch, not a feature: about 4 MB off the .wasm (15125 -> 11052 KiB, #30). Bevy's crates turn on
    # "register every reflected type automatically" by default, which makes the linker keep reflection code for
    # every Bevy type although the game never asks for it. The "static" flavour, without its opt-in environment
    # variable (BEVY_REFLECT_AUTO_REGISTER_STATIC), generates nothing, so all of that code can be dropped. The game
    # works the same: it never used automatic registration.
    "reflect_auto_register_static",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# On the desktop, let Bevy use several CPU cores. (The web build stays
# single-threaded: browser threads need extra server setup.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["multi_threaded"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser APIs: localStorage for saving, the touch-screen check, and a small
# status attribute on the <canvas> that the WebKit test reads.
web-sys = { version = "0.3", features = ["Window", "Storage", "Navigator", "Document", "Element", "Location"] }

# Development builds: optimise dependencies (Bevy is slow unoptimised) but keep
# our own code quick to compile.
[profile.dev]
opt-level = 1
# Only file:line tables, so crash messages still say where. Full debug info made
# build files many times bigger (Bevy is huge); `cargo tidy` keeps them in check.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The art tools (`--profile art`): fast code, quick to link, nothing of the game's size tuning.
[profile.art]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
strip = false

# Painter tests paint full 1920x1080 canvases: optimise them even in test builds.
[profile.dev.package.painter]
opt-level = 3

# Release builds are tuned for a small download rather than raw speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
