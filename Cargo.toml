[package]
name = "crabscape"
version = "0.1.0"
edition = "2024"
authors = ["Steven Kauwe"]
description = "A tiny RuneScape-inspired co-op browser game about crabs, written in Rust with Bevy."
publish = false
# `cargo run` starts the game (the workspace also has the headless `crabsim` runner).
default-run = "crabscape"

# The game is the root package. `crates/sim` is the simulation (the game rules with no graphics), which the game
# uses and which also runs headless (`cargo crabsim`); plain `cargo build` / `cargo test` / the wasm build cover the
# game and the simulation. The art tools and `crates/listen` (speech to text for spoken reports, its own wasm file,
# built by tools/build-web.sh) are the other members: `--workspace` or `-p painter` to include them.
[workspace]
members = ["crates/sim", "crates/painter", "crates/crabrig", "crates/listen", "tools/oil-atlas", "tools/webtest", "tools/cooptest"]
default-members = [".", "crates/sim"]
# Third-party code kept here with a fix of ours (see [patch.crates-io] below); not linted or tested as our own.
exclude = ["vendor"]

# Lints every crate here takes on (`[lints] workspace = true` in each Cargo.toml), on top of clippy's default groups.
# CI runs clippy with `-D warnings`, so anything clippy warns about fails the check too.
# The game rules (`crates/sim`) also forbid `unwrap()` outside tests: see the top of its lib.rs and main.rs.
[workspace.lints.rust]
# None of our code needs unsafe Rust; the libraries we use carry their own.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Debugging leftovers and unfinished code never land.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true

[dependencies]
# The game rules. The `bevy` feature makes its types Bevy components/resources.
crabsim = { path = "crates/sim", features = ["bevy"] }
# Bevy with its default features switched off, so only the parts this game
# actually uses get compiled in. That keeps the WebAssembly download small.
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "async_executor",    # runs Bevy's background tasks
    "bevy_asset",        # meshes and materials are "assets"
    "bevy_log",          # info!/warn! messages (the browser console on the web)
    "bevy_winit",        # windows and the event loop (a <canvas> on the web)
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render", # sprites and 2D meshes (our coloured shapes)
    "bevy_mesh",
    "bevy_color",
    "bevy_camera",
    "bevy_image",
    "png",               # decode the crab's parts pictures (loaded from assets/crab/)
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",    # the HUD text
    "default_font",      # a small font baked into the binary, so no font file to load
    "keyboard",
    "mouse",
    "touch",
    "gamepad",
    "bevy_gilrs",        # game controllers (in the browser, through the Gamepad API)
    "webgl2",            # browser backend: WebGL2 works on iPhone Safari / WebKit
    "web",               # browser timers and clocks (does nothing on native)
    "x11",
    "wayland",
    # A size switch, not a feature: about 4 MB off the .wasm (15125 -> 11052 KiB, #30). Bevy's crates turn on
    # "register every reflected type automatically" by default, which makes the linker keep reflection code for
    # every Bevy type although the game never asks for it. The "static" flavour, without its opt-in environment
    # variable (BEVY_REFLECT_AUTO_REGISTER_STATIC), generates nothing, so all of that code can be dropped. The game
    # works the same: it never used automatic registration.
    "reflect_auto_register_static",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# An exported character (src/character.rs): its checksum, and packing it about 4 times smaller. Both already in the
# build: the PNG decoder uses them.
crc32fast = "1"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

# Property tests (src/character.rs: any pasted text is answered, never a crash). As in crates/sim: without the
# default features that fork processes, and not for the browser target, where nothing runs tests.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }

# On the desktop, let Bevy use several CPU cores. (The web build stays
# single-threaded: browser threads need extra server setup.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["multi_threaded"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser APIs: localStorage for saving, the touch-screen check, a small
# status attribute on the <canvas> that the WebKit test reads, and Web Audio
# for the sounds (made in Rust, see src/sound.rs). wasm-bindgen (already
# under web-sys) for the listener that switches sound on at the first touch.
web-sys = { version = "0.3", features = [
    "Window", "Storage", "Navigator", "Document", "Element", "Location", "EventTarget",
    "AudioContext", "BaseAudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode",
    "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode", "AudioParam", "GainNode",
    "HtmlAudioElement", "HtmlMediaElement",
    # Music (src/music.rs): the echo on its bells, and the muffled underwater space.
    "DelayNode", "BiquadFilterNode", "BiquadFilterType",
    # Voice chat (src/voice.rs): the microphone, an audio connection per friend, their voice into Web Audio.
    "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "MediaStreamAudioSourceNode",
    "RtcPeerConnection", "RtcConfiguration", "RtcIceServer", "RtcIceCandidate", "RtcPeerConnectionIceEvent",
    "RtcSessionDescriptionInit", "RtcSdpType", "RtcTrackEvent", "RtcRtpTransceiver", "RtcRtpTransceiverInit",
    "RtcRtpTransceiverDirection", "RtcRtpSender", "RtcIceCandidateInit", "AnalyserNode",
    "RtcPeerConnectionState",
    # Reports (src/report.rs): the form on the page and its keys, recording a spoken report, the listener worker,
    # sending it.
    "HtmlElement", "HtmlTextAreaElement", "DomTokenList", "MediaRecorder", "BlobEvent", "Blob", "OfflineAudioContext",
    "Event", "UiEvent", "KeyboardEvent", "NodeList",
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "RequestInit", "Response",
    # Exporting and importing a character (src/character.rs): copy, share or download the code, pick a file.
    "Clipboard", "ShareData", "File", "FileList", "FilePropertyBag", "HtmlInputElement", "HtmlAnchorElement",
    "HtmlDocument", "Url",
] }
wasm-bindgen = "0.2"
# Reflect, to set navigator.audioSession (not in web-sys yet): iPhone sound with the silent switch on.
js-sys = "0.3"
# Co-op (src/coop.rs): browser-to-browser connections (WebRTC), introduced by tools/introducer. Web only for now.
matchbox_socket = "0.14"
# Runs the connection's background work on the browser's event loop.
wasm-bindgen-futures = "0.4"

# matchbox_socket 0.14.0 as published, plus two fixes in src/webrtc_socket/wasm.rs (marked "CrabScape fix"):
# - a connection still being set up when the socket is dropped (a device joining the room afresh) is closed and its
#   event handlers detached, instead of leaving the browser to call Rust closures that were freed, which crashed the
#   page;
# - setting up a connection waits at most 3 s for the browser to finish gathering its addresses (not up to ~40 s
#   on a computer with a network that can't reach the address servers), so a friend who reloads gets back in.
# Drop this once matchbox itself does both.
[patch.crates-io]
matchbox_socket = { path = "vendor/matchbox_socket" }

# Development builds: optimise dependencies (Bevy is slow unoptimised) but keep
# our own code quick to compile.
[profile.dev]
opt-level = 1
# Only file:line tables, so crash messages still say where. Full debug info made
# build files many times bigger (Bevy is huge); `cargo tidy` keeps them in check.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The art tools (`--profile art`): fast code, quick to link, nothing of the game's size tuning.
[profile.art]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
strip = false

# Painter tests paint full 1920x1080 canvases: optimise them even in test builds.
[profile.dev.package.painter]
opt-level = 3
[profile.dev.package.brushwork]
opt-level = 3
[profile.dev.package.brushwork-kit]
opt-level = 3
[profile.dev.package.brushwork-paint]
opt-level = 3

# Release builds are tuned for a small download rather than raw speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
