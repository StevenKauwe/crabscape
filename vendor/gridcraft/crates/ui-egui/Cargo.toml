[package]
name = "gridcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft egui frontend (Excel-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
gridcraft-engine = { path = "../engine", version = "0.3.0" }
gridcraft-chart = { path = "../chart", version = "0.3.0" }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
