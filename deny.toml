# cargo-deny: checks every dependency (of the game, the tools and the introducer) for known security advisories,
# licences we haven't accepted, duplicate versions and unknown sources. CI runs it in the required
# "fmt, clippy (native + wasm32), tests" job, three times (run them locally the same way):
#   cargo deny --workspace --locked check                                    # native PC
#   cargo deny --workspace --locked --target wasm32-unknown-unknown check   # the browser
#   cargo deny --manifest-path tools/introducer/Cargo.toml --config deny.toml --locked check
# Our own crates have no licence on purpose (all rights reserved) and are never published: they are skipped below.

[graph]
# Native PC (Linux, macOS, Windows). The browser is checked in a run of its own (`--target wasm32-unknown-unknown`):
# in one run with both, cargo-deny would join "web only" and "native only" conditions from different crates, and
# report, for example, the native WebRTC and TLS code of matchbox_socket, a crate the game only uses on the web.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Vulnerabilities always fail. Unmaintained crates fail only when we depend on them directly: deep in Bevy's tree
# they are Bevy's to replace.
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "allow"
# Each ignore says why it can't reach us. Drop it once the dependency moves past the fixed version.
ignore = [
    # zip 7 (under candle-core, in crates/listen): these are about ZipArchive::extract writing an archive to disk.
    # candle only reads tensors out of .npz/.pth archives (never extract), and listen loads safetensors, no zip.
    # Fixed in zip 9; candle-core 0.9 still needs zip 7.
    { id = "RUSTSEC-2026-0367", reason = "zip extract(): candle never extracts archives" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract(): candle never extracts archives" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract(): candle never extracts archives" },
]

[licenses]
# Exactly the licences the current dependency tree uses, all permissive. A dependency under any other licence fails
# the check: look at it before adding it here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # Mozilla's list of root certificates (webpki-roots), in the introducer.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# One file for three graphs (native, browser, introducer): an entry only one of them needs is not a mistake.
unused-allowed-license = "allow"
# Our own crates: unlicensed and unpublished on purpose.
private = { ignore = true }

[bans]
# Two versions of one crate are both compiled in, and both downloaded in the web build: warn, so a new duplicate
# shows in the log. Not an error: most come from Bevy's own tree.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The owner's oil painter (crates/painter).
allow-git = ["https://github.com/StevenKauwe/brushwork"]
unused-allowed-source = "allow"
