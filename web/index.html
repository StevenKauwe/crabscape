<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fill the phone screen; stop pinch-zoom from fighting with taps. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#03090c">
  <title>CrabScape</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #03090c;
      color: #f4e7d0;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    /* Bevy keeps the canvas the size of this box. */
    #game {
      position: fixed;
      inset: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none; /* taps go to the game, not to scrolling */
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    #message {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      pointer-events: none;
    }
    #message.error {
      pointer-events: auto;
      background: #03090c;
    }
    /* A short note over the dimmed game (src/coop.rs: a new version is out, and the page reloads). */
    #message.note { background: #03090cb3; font-size: 18px; }
    #message[hidden] { display: none; }
    /* Replays (press F9, or the Replay button with ?replay in the address). */
    #replay-button {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border: 1px solid #f4e7d055;
      border-radius: 14px;
      background: #03090ccc;
      color: inherit;
      font: inherit;
      font-size: 14px;
    }
    #replay-box {
      position: fixed;
      inset: 10%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      border-radius: 10px;
      background: #03090cf0;
      border: 1px solid #f4e7d055;
    }
    #replay-box textarea { flex: 1; font: 12px/1.3 ui-monospace, monospace; background: #0b1519; color: inherit; }
    #replay-box button { font: inherit; padding: 6px 14px; }
    /* The report form (src/report.rs fills it in and sends it), and the character box (src/character.rs: export
       and import a crab), which looks the same. */
    #report, #character {
      position: fixed;
      left: 50%;
      top: max(12px, env(safe-area-inset-top));
      transform: translateX(-50%);
      width: min(440px, calc(100% - 24px));
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border-radius: 12px;
      background: #03090cf2;
      border: 1px solid #f4e7d055;
    }
    #report .row, #character .row { display: flex; gap: 8px; align-items: center; }
    #report .grow, #character .grow { flex: 1; }
    #report button, #character button {
      font: inherit;
      font-size: 15px;
      padding: 7px 14px;
      border-radius: 16px;
      border: 1px solid #f4e7d055;
      background: #0b1519;
      color: inherit;
    }
    #report button.on { background: #4f7f86; }
    #report textarea, #character textarea {
      min-height: 110px;
      font: inherit;
      font-size: 16px; /* 16px or more: iPhones don't zoom in on it */
      padding: 8px;
      border-radius: 8px;
      background: #0b1519;
      color: inherit;
      border: 1px solid #f4e7d033;
      resize: vertical;
    }
    #report-note, #character-note { min-height: 1.4em; font-size: 14px; opacity: 0.8; }
    #character { max-height: calc(100% - 24px); overflow-y: auto; }
    #character-title { font-weight: 600; }
    #character-summary { white-space: pre-line; font-size: 14px; }
    #character-summary:empty { display: none; }
    #character textarea { min-height: 72px; max-height: 28vh; word-break: break-all; }
    #character-confirm { display: flex; flex-direction: column; gap: 8px; }
    #character button.danger { background: #8c2a24; border-color: #ff7b6e; }
    /* Recording: a red Stop button with a blinking dot, a red edge on the box, and a bar that moves with the voice. */
    #report button.rec { background: #8c2a24; border-color: #ff7b6e; }
    #report button.rec::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 7px;
      border-radius: 50%;
      background: #ff5d50;
      vertical-align: 1px;
      animation: rec-blink 1s ease-in-out infinite;
    }
    @keyframes rec-blink { 50% { opacity: 0.2; } }
    #report.recording textarea { border-color: #ff7b6e; outline: 2px solid #ff7b6e; outline-offset: -1px; }
    #report-level { height: 6px; border-radius: 3px; background: #0b1519; overflow: hidden; }
    #report-level > div { height: 100%; width: 0; background: #ff7b6e; }
    /* On a keyboard (src/report.rs adds .keys), each button wears its key: a small drawn keycap, lit from above with
       a deeper edge underneath. Alt (Option on a Mac) only shows while the text box has the cursor: then the bare
       letters type. */
    #report kbd {
      display: none;
      min-width: 1.15em;
      margin-right: 3px;
      padding: 0 5px;
      border-radius: 5px;
      border: 1px solid #f4e7d066;
      border-bottom: 3px solid #f4e7d040;
      background: linear-gradient(#2c3f45, #16252a);
      box-shadow: inset 0 1px 0 #ffffff22;
      color: #f4e7d0;
      font: 600 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
      vertical-align: 1px;
    }
    #report kbd:last-of-type { margin-right: 7px; }
    #report.keys kbd { display: inline-block; }
    #report.keys kbd.alt { display: none; }
    #report.keys:has(#report-text:focus) kbd.alt { display: inline-block; }
    #report button.on kbd { background: linear-gradient(#5d9198, #3d6a70); }
    #report button.rec kbd { background: linear-gradient(#a8443c, #6e1f1a); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="game"><canvas id="crabscape" tabindex="0"></canvas></div>
  <div id="message" role="status">Loading CrabScape&hellip; 🦀</div>
  <div id="report" hidden>
    <div class="row">
      <button id="report-bug" class="on"><kbd class="alt">Alt</kbd><kbd>B</kbd>Bug</button>
      <button id="report-idea"><kbd class="alt">Alt</kbd><kbd>I</kbd>Idea</button>
    </div>
    <textarea id="report-text" maxlength="2000" placeholder="What happened, or what would make it better? Type, or tap Speak."></textarea>
    <div id="report-level" hidden><div></div></div>
    <div id="report-note" role="status"></div>
    <div class="row">
      <button id="report-speak"><kbd class="alt">Alt</kbd><kbd>S</kbd><span class="label">Speak</span></button>
      <span class="grow"></span>
      <button id="report-cancel"><kbd>Esc</kbd>Close</button>
      <button id="report-send"><kbd class="command">Ctrl</kbd><kbd>&#x21b5;</kbd>Send</button>
    </div>
  </div>
  <div id="character" hidden>
    <div id="character-title"></div>
    <div id="character-summary"></div>
    <textarea id="character-code" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
      placeholder="Paste a character code here"></textarea>
    <div id="character-note" role="status"></div>
    <div class="row" id="character-export">
      <button id="character-copy">Copy code</button><button id="character-save">Save file</button>
      <span class="grow"></span><button id="character-close">Close</button>
    </div>
    <div class="row" id="character-import">
      <button id="character-choose">Choose file</button>
      <input id="character-file" type="file" accept=".crab,text/plain" hidden>
      <span class="grow"></span><button id="character-close-import">Close</button>
    </div>
    <div id="character-confirm" hidden>
      <div><strong>Replace your crab?</strong> The crab on this device is lost for good.</div>
      <div class="row">
        <span class="grow"></span><button id="character-keep">Keep mine</button>
        <button id="character-replace" class="danger">Replace</button>
      </div>
    </div>
  </div>
  <button id="replay-button" hidden>Replay</button>
  <div id="replay-box" hidden>
    <div>Your replay. Copy all of it and send it with what felt wrong.</div>
    <textarea readonly></textarea>
    <div><button id="replay-copy">Copy</button> <button id="replay-close">Close</button></div>
  </div>

  <script type="module">
    // Relative paths on purpose: the page also works from a subfolder (GitHub
    // Pages) or inside an iframe.
    //
    // The JavaScript glue and the .wasm must come from the same build: a
    // browser holding an old cached glue with a new .wasm (a tab reopened
    // after an update) fails with "... is not a function". So the build writes
    // a stamp of its files to pkg/version.txt, always fetched fresh, and both
    // are loaded with it in the address. No stamp (an older build): load as is.
    const stamp = fetch("./pkg/version.txt", { cache: "no-store" })
      .then((r) => (r.ok ? r.text() : ""), () => "")
      .then((v) => (v.trim() ? "?v=" + encodeURIComponent(v.trim()) : ""));
    const init = (q) =>
      import("./pkg/crabscape.js" + q).then((glue) =>
        glue.default({ module_or_path: new URL("./pkg/crabscape_bg.wasm" + q, location.href) }),
      );

    const message = document.getElementById("message");

    function showError(detail) {
      message.classList.add("error");
      message.hidden = false;
      message.innerHTML =
        "<div><p><strong>Sorry, CrabScape couldn't start in this browser.</strong></p>" +
        "<p>It needs WebAssembly and WebGL2, which recent Safari, Chrome, Firefox and Edge all have. " +
        "Try reloading the page, updating your browser, or a different browser.</p>" +
        "<p style='opacity:.6;font-size:13px'></p></div>";
      message.querySelector("p:last-child").textContent = "Details: " + detail;
    }

    // Bevy's window library (winit) deliberately throws this to take over the
    // browser's event loop. It means the game is running, not that it broke.
    const isControlFlow = (e) => String(e && (e.message || e)).includes("Using exceptions for control flow");

    if (!window.WebAssembly) {
      showError("WebAssembly is not available.");
    } else if (!document.createElement("canvas").getContext("webgl2")) {
      showError("WebGL2 is not available (it may be switched off, or the graphics driver is blocked).");
    } else {
      // Keyboard keys go to the game's canvas once it has the focus. Give it
      // the focus now, and again whenever the page is clicked or tapped.
      const canvas = document.getElementById("crabscape");
      const focusGame = () => canvas.focus({ preventScroll: true });
      // Not while typing a report or a character code: the box keeps the keys.
      document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#report, #character")) focusGame(); });
      // Replays: the game writes the text into data-replay on the canvas
      // (F9, see src/replay.rs); show it in a box to copy. With ?replay in the
      // address there is also a button, for phones, which asks the game for
      // one by setting data-want-replay.
      const box = document.getElementById("replay-box");
      const text = box.querySelector("textarea");
      new MutationObserver(() => {
        text.value = canvas.getAttribute("data-replay") || "";
        box.hidden = false;
        text.select();
      }).observe(canvas, { attributeFilter: ["data-replay"] });
      document.getElementById("replay-copy").onclick = () => {
        text.select();
        (navigator.clipboard ? navigator.clipboard.writeText(text.value) : Promise.reject())
          .catch(() => document.execCommand("copy"));
      };
      document.getElementById("replay-close").onclick = () => { box.hidden = true; focusGame(); };
      if (new URLSearchParams(location.search).has("replay")) {
        const button = document.getElementById("replay-button");
        button.hidden = false;
        button.onclick = () => canvas.setAttribute("data-want-replay", "1");
      }
      stamp.then(init).then(
        () => { message.hidden = true; focusGame(); },
        (e) => {
          if (isControlFlow(e)) {
            message.hidden = true;
            focusGame();
          } else {
            console.error(e);
            showError(String(e && (e.message || e)));
          }
        },
      );
      // The game crashing later shows up as an uncaught error. (Browsers also
      // report a harmless "ResizeObserver loop" warning this way; skip it.)
      window.addEventListener("error", (ev) => {
        const text = String(ev.message || "");
        if (isControlFlow(ev.error || text) || text.includes("ResizeObserver")) return;
        showError(text || "unknown error");
      });
    }
  </script>
</body>
</html>
