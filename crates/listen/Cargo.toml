[package]
name = "listen"
version = "0.1.0"
edition = "2024"
publish = false
description = "Speech to text on the player's device (Moonshine tiny), for spoken bug reports. Its own small WebAssembly file, loaded only when someone speaks a report."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope", "WorkerGlobalScope", "MessageEvent", "Cache", "CacheStorage", "Response",
] }
# candle pulls in rand; in the browser its random numbers come from the page's crypto API.
getrandom = { version = "0.3", features = ["wasm_js"] }
