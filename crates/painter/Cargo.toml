[package]
name = "painter"
version = "0.1.0"
edition = "2024"
authors = ["Steven Kauwe"]
description = "The oil painter (brushwork) and its crabpaint command line. Art tool, not part of the game."
publish = false

[dependencies]
# The painter itself lives upstream in brushwork (MIT, https://github.com/StevenKauwe/brushwork).
brushwork = { git = "https://github.com/StevenKauwe/brushwork", tag = "v0.1.0" }
brushwork-kit = { git = "https://github.com/StevenKauwe/brushwork", tag = "v0.1.0" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[features]
# brushwork's GPU backend (wgpu). Off by default and in CI; crabpaint's photo painting runs on the CPU either way.
gpu = ["brushwork/gpu"]

[[bin]]
name = "crabpaint"
path = "src/bin/crabpaint.rs"
