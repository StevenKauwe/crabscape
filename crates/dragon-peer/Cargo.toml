[package]
name = "dragon-peer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared Matchbox transport for Dragon browser and optional native mission co-op."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Native WebRTC is deliberately opt-in; browser behavior is unchanged.
native = ["dep:matchbox_socket"]
# Explicit local-only integration harness, never enabled by normal builds.
loopback-test = ["native", "dep:matchbox_signaling", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
matchbox_socket = { version = "0.14", optional = true }
matchbox_signaling = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
matchbox_socket = "0.14"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "Performance", "MediaDevices", "MediaStream", "MediaStreamTrack",
    "MediaStreamConstraints", "MediaStreamTrackState", "AudioContext", "BaseAudioContext", "AudioContextState", "AudioNode",
    "AudioDestinationNode", "AudioParam", "GainNode", "AnalyserNode", "MediaStreamAudioSourceNode",
    "HtmlAudioElement", "HtmlMediaElement", "RtcPeerConnection", "RtcConfiguration", "RtcIceServer",
    "RtcPeerConnectionIceEvent", "RtcIceCandidate", "RtcTrackEvent", "RtcSessionDescriptionInit",
    "RtcSdpType", "RtcRtpTransceiver", "RtcRtpTransceiverInit", "RtcRtpTransceiverDirection",
    "RtcRtpSender", "RtcIceCandidateInit", "RtcPeerConnectionState",
] }

[lints]
workspace = true
