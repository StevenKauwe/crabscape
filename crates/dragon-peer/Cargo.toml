[package]
name = "dragon-peer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Small Matchbox transport for Dragon's browser-local mission co-op."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
matchbox_socket = "0.14"

[lints]
workspace = true
