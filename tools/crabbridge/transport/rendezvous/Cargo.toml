[package]
name = "harbor-rendezvous"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
subtle = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

futures-util = "0.3"
tokio = { version = "1", features = ["test-util"] }
