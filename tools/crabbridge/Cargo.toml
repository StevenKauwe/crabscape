[package]
name = "codex-harbor"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
rpassword = "7"
portable-pty = "0.9"
libc = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
harbor-transport-spike = { path = "transport/host" }
harbor-noise = { path = "transport/auth" }
webrtc = "0.14"

futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
matchbox_signaling = "0.14"
tower = { version = "0.5", features = ["util"] }

# Isolated host tool; not part of the game Cargo graph.
[workspace]
