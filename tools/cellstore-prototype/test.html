<!doctype html><meta charset="utf-8"><title>IndexedDB chunk protocol tests</title>
<body data-result="running"><script type="module">
import { openChunkPrototype } from './indexeddb.js';
const assert = (ok, text) => { if (!ok) throw new Error(text); };
const fails = async p => { let failed = false; try { await p; } catch (_) { failed = true; } assert(failed, 'expected failure'); };
const bytes = s => new TextEncoder().encode(s);
const str = b => new TextDecoder().decode(b);
(async () => {
  const name = 'crabscape-cellstore-prototype-test-' + Date.now();
  const a = await openChunkPrototype(name), b = await openChunkPrototype(name);
  let e = await a.begin('first', 4, bytes('player1'));
  await a.stage('first', e, [['shared', bytes('s')], ['old', bytes('o')]]);
  await a.publish('first', e, 2);
  let read = await b.read();
  assert(read.head.tick === 4 && str(read.head.player) === 'player1' && read.chunks.map(str).join('') === 'so', 'first snapshot');
  const pinned = await b.pin('reader');
  assert(pinned.tick === 4 && pinned.count === 2, 'pin initial manifest');
  e = await a.begin('next', 5, bytes('player2'), 2);
  await fails(b.begin('overlap', 6, bytes('p')));
  await a.stage('next', e, [['shared', bytes('s')], ['new', bytes('n')]]);
  await b.collect();
  assert((await b.read()).chunks.map(str).join('') === 'so', 'old head retained while staging');
  await fails(a.publish('next', e, 3));
  assert((await b.read()).head.tick === 4, 'incomplete publish retains old head');
  await a.publish('next', e, 2);
  assert(await b.collect() === 0, 'pin prevents collection of old chunks');
  assert((await b.readPage('reader', pinned.epoch, 0, 1)).map(x => str(x.bytes)).join('') === 's', 'pinned page 1');
  assert((await b.readPage('reader', pinned.epoch, 1, 1)).map(x => str(x.bytes)).join('') === 'o', 'pinned page 2');
  await b.unpin('reader', pinned.epoch);
  assert(await b.collect() === 1, 'old unshared chunk collected after unpin');
  read = await b.read();
  assert(read.head.tick === 5 && read.chunks.map(str).join('') === 'sn', 'new consistent snapshot');
  let stale = await a.begin('stale', 6, bytes('p'));
  await fails(a.stage('stale', stale, [['x', bytes('x')], ['shared', bytes('WRONG')]]));
  await a.stage('stale', stale, [['x', bytes('other')]]); // Failed batch was rolled back.
  await b.reset();
  let fresh = await b.begin('fresh', 7, bytes('fresh'));
  await b.stage('fresh', fresh, [['f', bytes('f')]]);
  await b.publish('fresh', fresh, 1);
  await fails(a.stage('stale', stale, [['stale', bytes('s')]]));
  await fails(a.publish('stale', stale, 1));
  assert((await b.read()).head.tick === 7, 'reset fences stale writer');
  const c = await a.begin('c', 8, bytes('c'), 2);
  const d = await b.begin('d', 9, bytes('d'), 2);
  await a.stage('c', c, [['c', bytes('c')]]);
  await b.stage('d', d, [['d', bytes('d')]]);
  await a.publish('c', c, 1);
  await fails(b.publish('d', d, 1));
  assert((await a.read()).head.tick === 8, 'CAS fences competing writer');
  await b.abandon('d', d);
  await a.collect();
  const mutablePlayer = bytes('frozen');
  const pending = a.begin('queued', 10, mutablePlayer);
  mutablePlayer.fill(0);
  const queued = await pending;
  const mutableChunk = bytes('before');
  const staging = a.stage('queued', queued, [['queued', mutableChunk]]);
  mutableChunk.fill(0);
  await staging;
  await a.publish('queued', queued, 1);
  read = await b.read();
  assert(str(read.head.player) === 'frozen' && str(read.chunks[0]) === 'before', 'input copied before asynchronous transactions');
  const doomedPin = await b.pin('doomed');
  const oldEpoch = await a.begin('racing', 11, bytes('p'), 2);
  const beforeReset = a.stage('racing', oldEpoch, [['racing', bytes('r')]]);
  const reset = b.reset();
  await Promise.all([beforeReset, reset]);
  await fails(a.publish('racing', oldEpoch, 1));
  await fails(b.readPage('doomed', doomedPin.epoch, 0, 1));
  assert(await b.read() === null, 'reset after already-started stage leaves no head');
  a.close(); b.close(); indexedDB.deleteDatabase(name);
  document.body.dataset.result = 'PASS';
})().catch(e => { document.body.dataset.result = 'FAIL: ' + e.message; });
</script></body>
