<!doctype html><meta charset="utf-8"><title>Frozen terrain IndexedDB proof</title>
<body data-result="running"><script type="module">
import init, { Proof } from './pkg/cellstore_proof.js';
import { openChunkPrototype } from './indexeddb.js';
const assert = (value, message) => { if (!value) throw new Error(message); };
const text = value => new TextDecoder().decode(value);
const fails = async p => { let ok = false; try { await p; } catch (_) { ok = true; } assert(ok, 'expected rejection'); };
(async () => {
  const wasm = await init();
  let maxWasm = Math.max(wasm.memory.buffer.byteLength, Number(sessionStorage.getItem('proof-memory') || 0));
  const measure = () => { maxWasm = Math.max(maxWasm, wasm.memory.buffer.byteLength); };
  const proof = new Proof(); measure();
  const worldTick = proof.tick(), count = proof.sleeping_count();
  assert(count > 0 && count <= 256, 'fixture must have sleeping chunks within restore limit');
  const previousName = sessionStorage.getItem('proof-db');
  const name = previousName || 'crabscape-proof-' + Date.now();
  const db = await openChunkPrototype(name);
  const player = new TextEncoder().encode(JSON.stringify({ x: 400, y: 48, health: 77, tick: worldTick }));
  if (!previousName) {
  const epoch = await db.begin('save', worldTick, player);
  let expected = 0, batch = [];
  async function append(key, bytes) { batch.push([key, bytes]); expected++; if (batch.length === 4) { await db.stage('save', epoch, batch); batch = []; measure(); } }
  await append('metadata', proof.metadata());
  for (let y = 0; y < proof.rows(); y++) for (let x = 0; x < proof.cols(); x++) await append(`active-${x}-${y}`, proof.active(x, y));
  for (let i = 0; i < count; i++) await append(`sleep-${i}`, proof.sleeping(i));
  if (batch.length) await db.stage('save', epoch, batch);
  await db.publish('save', epoch, expected);
  const interrupted = await db.begin('interrupted', worldTick + 1, new TextEncoder().encode('bad'));
  await db.stage('interrupted', interrupted, [['partial', new Uint8Array([1, 2, 3])]]);
  sessionStorage.setItem('proof-db', name);
  sessionStorage.setItem('proof-epoch', String(interrupted));
  sessionStorage.setItem('proof-memory', String(maxWasm));
  db.close();
  location.reload();
  return;
  }
  const interrupted = Number(sessionStorage.getItem('proof-epoch'));
  const pin = await db.pin('reader');
  const restoredPlayer = JSON.parse(text(pin.player));
  assert(restoredPlayer.tick === worldTick && restoredPlayer.health === 77 && restoredPlayer.x === 400 && pin.tick === worldTick, 'player/tick manifest');
  let started = false, pages = 0;
  for (let offset = 0; offset < pin.count; offset += 4) {
    const parts = await db.readPage('reader', pin.epoch, offset, 4); pages++;
    for (const part of parts) {
      if (part.key === 'metadata') { proof.begin_restore(part.bytes, count); started = true; }
      else if (part.key.startsWith('active-')) { assert(started, 'metadata must precede chunks'); proof.restore_active(part.bytes); }
      else if (part.key.startsWith('sleep-')) proof.restore_sleeping(part.bytes);
      else throw new Error('unexpected part');
    }
    measure();
  }
  assert(proof.finish_restore(), 'reconstructed world differs'); measure();
  await db.unpin('reader', pin.epoch);
  await db.abandon('interrupted', interrupted);
  await db.collect();
  const race = await db.begin('race', worldTick + 2, player);
  const pending = db.stage('race', race, [['late', new Uint8Array([9])]]);
  const resetting = db.reset();
  await Promise.all([pending, resetting]);
  await fails(db.publish('race', race, 1));
  assert(await db.read() === null, 'reset must not resurrect save');
  db.close();
  sessionStorage.removeItem('proof-db');
  sessionStorage.removeItem('proof-epoch');
  sessionStorage.removeItem('proof-memory');
  document.body.dataset.result = `PASS sleeping=${count} pages=${pages} tick=${worldTick} snapshot_estimate=${proof.estimate()} wasm_capacity=${maxWasm}`;
})().catch(e => { document.body.dataset.result = 'FAIL: ' + e.message; });
</script></body>
