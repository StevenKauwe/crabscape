# The co-op introducer on Fly.io (see src/main.rs): exactly one machine, deployed by .github/workflows/introducer.yml.
# The game connects to wss://<app>.fly.dev, so if this name changes, change INTRODUCER in src/coop.rs too.
app = "crabscape-introducer"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3536
  force_https = true
  # Asleep when nobody is playing (costs next to nothing); the first player to connect wakes it in a moment.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
