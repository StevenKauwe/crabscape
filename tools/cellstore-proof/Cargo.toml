[package]
name = "cellstore-proof"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
browser-proof = ["dep:crabsim"]
browser-runner = []

[[bin]]
name = "browser-proof"
required-features = ["browser-runner"]

[dependencies]
sha2 = "0.10.9"

[workspace]

[target.'cfg(target_arch = "wasm32")'.dependencies]
crabsim = { path = "../../crates/sim", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-util = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Event", "EventTarget", "DomException", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "IdbCursor", "IdbKeyRange"] }
