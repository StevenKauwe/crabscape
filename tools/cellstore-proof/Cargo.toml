[package]
name = "cellstore-proof"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
browser-proof = ["dep:crabsim"]
browser-runner = []
webkit-runner = ["browser-runner", "dep:base64", "dep:png", "dep:serde_json"]

[[bin]]
name = "browser-proof"
required-features = ["browser-runner"]

[dependencies]
sha2 = "0.10.9"

[workspace]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = { version = "0.22", optional = true }
png = { version = "0.18", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
crabsim = { path = "../../crates/sim", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-util = "0.3"
js-sys = "0.3"
serde_json = "1"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
crc32fast = "1"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
web-sys = { version = "0.3", features = ["Window", "Event", "EventTarget", "DomException", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "IdbCursor", "IdbKeyRange", "Document", "Element", "Node", "HtmlElement", "HtmlIFrameElement", "BroadcastChannel", "MessageEvent"] }
