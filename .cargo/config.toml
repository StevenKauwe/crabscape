# Shortcuts for `cargo`. (Only aliases here: build flags would leak into the wasm build, which must stay plain.)
[alias]
# Run the game's simulation headless: `cargo crabsim --help`.
crabsim = "run --release --quiet -p crabsim --"
# `cargo tidy`: says how big the build files are and cleans them up if they get too big (see tools/tidy).
tidy = "run -q --release --offline --manifest-path tools/tidy/Cargo.toml --"
# `cargo webtest`: play the web build (web/) in WebKit, the iPhone engine, and check it works (see tools/webtest).
webtest = "run --profile art --quiet -p webtest --"
