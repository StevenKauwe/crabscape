# Shortcuts for `cargo`. (No build flags here: they would leak into the wasm build, which must stay plain.)
[alias]
# Run the game's simulation headless: `cargo crabsim --help`.
crabsim = "run --release --quiet -p crabsim --"
# `cargo tidy`: says how big the build files are and cleans them up if they get too big (see tools/tidy).
tidy = "run -q --release --offline --manifest-path tools/tidy/Cargo.toml --"
# `cargo webtest`: play the web build (web/) in WebKit, the iPhone engine, and check it works (see tools/webtest).
webtest = "run --profile art --quiet -p webtest --"
# `cargo cooptest`: play co-op in real Chrome browsers and check its promises (docs/design/coop-promises.md).
cooptest = "run --profile art --quiet -p cooptest --"

# `cargo test -p crabsim --target wasm32-wasip1` runs the simulation's tests as WebAssembly in wasmtime, to prove it
# plays out bit for bit the same as natively (CI does). Only for that target; the browser build is untouched.
[target.wasm32-wasip1]
runner = "wasmtime"
