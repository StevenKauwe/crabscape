# Playable previews: every pull request (and any named branch, on demand)
# builds to its own folder on the gh-pages branch, so many builds of the
# game are playable at once from one Pages site:
#
#   /                 the main build (published to the store by ci.yml)
#   /pr-42/           pull request #42's build
#   /branches/design-bible/   a named branch, on demand
#   /builds/          the chooser page listing everything
#
# gh-pages is the STORE and the source of truth: main pushes its build to
# the store's root, previews push folders, and whoever pushes last also
# deploys the whole store — so a new preview is live the moment its job
# finishes. Bootstrap-safe: the deploy is skipped while the store has no
# main build at its root yet (so this very PR cannot blank the site).
#
# Actions are pinned to commit SHAs; the comment says which release that is.
# Everything else is plain git + shell, like tools/build-web.sh.
name: previews

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build a preview for (e.g. design-bible)"
        required: true

permissions:
  contents: write # push preview folders to the gh-pages store
  pull-requests: write # keep one "Preview build" comment per PR

concurrency:
  group: previews-pr-${{ github.event.number || github.event.inputs.branch }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""
  BINARYEN_VERSION: "133"

jobs:
  # ---------------------------------------------------------------- closed --
  cleanup:
    name: remove the preview folder
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Delete pr-${{ github.event.number }} from the store and refresh /builds/
        run: tools/previews.sh cleanup "pr-${{ github.event.number }}"
      - id: snap
        name: Assemble the site from the store
        run: tools/previews.sh snapshot site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.snap.outputs.deployed == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.snap.outputs.deployed == 'true'
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.snap.outputs.deployed == 'true'

  # ----------------------------------------------------------------- build --
  preview:
    name: build the preview folder
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Where this build goes: pr-<number>, or branches/<name> for dispatches.
      FOLDER: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('branches/{0}', github.event.inputs.branch) }}
      # What to check out: the PR merge ref, or the named branch.
      REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.inputs.branch }}
      SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - name: wasm-bindgen version from Cargo.lock
        id: wb
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }},wasm-tools
      - name: Install wasm-opt (binaryen ${{ env.BINARYEN_VERSION }})
        run: |
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o binaryen.tgz
          curl -fsSL "$url.sha256" -o binaryen.tgz.sha256
          echo "$(awk '{print $1}' binaryen.tgz.sha256)  binaryen.tgz" | sha256sum -c -
          tar -xzf binaryen.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          rm binaryen.tgz binaryen.tgz.sha256
      - name: Build the web game
        run: |
          # Preview builds carry the dev-checkpoints feature (issue #55):
          # the picker gains a CHECKPOINTS section from dev/checkpoints/*.ron.
          tools/build-web.sh --features dev-checkpoints
      - name: No relaxed SIMD (iPhone/WebKit rejects it)
        run: wasm-tools validate --features=-relaxed-simd web/pkg/crabscape_bg.wasm

      - name: Publish folder to the store and refresh /builds/
        run: tools/previews.sh publish "$FOLDER" "$SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upsert the PR comment with the playable URL
        if: github.event_name == 'pull_request'
        run: tools/previews.sh comment "${{ github.event.number }}" "pr-${{ github.event.number }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ env.SHA }}

      - id: snap
        name: Assemble the site from the store
        run: tools/previews.sh snapshot site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.snap.outputs.deployed == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.snap.outputs.deployed == 'true'
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.snap.outputs.deployed == 'true'
