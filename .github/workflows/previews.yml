# Playable previews: every pull request (and any named branch, on demand) is playable from its own folder on the
# one Pages site:
#
#   /                         the main build
#   /pr-42/                   pull request #42's build
#   /branches/design-bible/   a named branch: gh workflow run ci.yml --ref design-bible
#   /builds/                  the chooser page listing everything
#
# ci.yml builds the game once per run and publishes that build (its `preview` job for PRs and branches, its deploy
# job for main). This workflow only removes a pull request's folder when it closes. The gh-pages branch is the store
# (one commit, replaced on every update); every job that changes it also deploys all of it (tools/previews.sh).
#
# Actions are pinned to commit SHAs; the comment says which release that is.
name: previews

on:
  pull_request:
    types: [closed]

permissions:
  contents: write # remove the folder from the gh-pages store

concurrency:
  group: previews-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: remove the preview folder
    runs-on: ubuntu-latest
    # Same transaction lock as main and preview publication; retain distinct waiting cleanups.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read # verify this run's uploaded artifact is visible
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Delete pr-${{ github.event.number }} from the store and refresh /builds/
        run: tools/previews.sh cleanup "pr-${{ github.event.number }}"
      - id: snap
        name: Assemble the site from the store
        run: tools/previews.sh snapshot site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.snap.outputs.deployed == 'true'
      - id: pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.snap.outputs.deployed == 'true'
        with:
          name: github-pages-${{ github.job }}-${{ github.run_attempt }}
          path: site
      - name: Wait for the uploaded Pages artifact
        if: steps.snap.outputs.deployed == 'true'
        timeout-minutes: 2
        run: bash tools/wait-pages-artifact.sh "$ARTIFACT_ID" "$ARTIFACT_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.job }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.snap.outputs.deployed == 'true'
        with:
          artifact_name: github-pages-${{ github.job }}-${{ github.run_attempt }}
          timeout: 600000 # Keep the same supported sync budget as preview and main.
