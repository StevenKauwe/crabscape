# Checks every push and pull request and builds the web game once: the browser test plays that build, a pull
# request publishes it as its playable preview, and on main it is deployed to GitHub Pages.
# A pull request runs only the checks its files can affect (the `changes` job, tools/changes.sh): words alone pass in
# seconds. A check skipped that way counts as passed for branch protection. Pushes to main run everything.
# Independent work runs in parallel on its own machine (CLAUDE.md, "CI hygiene"): a code change's required checks
# take about 7 minutes. Coverage runs on main only (coverage.yml).
# Actions are pinned to commit SHAs; the comment says which release that is.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Never let extra CPU features (relaxed SIMD!) into the build.
  RUSTFLAGS: ""
  BINARYEN_VERSION: "133"

jobs:
  changes:
    name: what changed
    # Flags for the jobs below, from the files the pull request changed (tools/changes.sh says which flag means
    # what). Anything else (a push to main, a run by hand) turns every flag on. If this job itself fails, the jobs
    # below run anyway (`needs.changes.result != 'success'`): when in doubt, check.
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.flags.outputs.docs_only }}
      code: ${{ steps.flags.outputs.code }}
      art: ${{ steps.flags.outputs.art }}
      introducer: ${{ steps.flags.outputs.introducer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as its merge into the base: its first parent is the base.
          fetch-depth: 2
      - id: flags
        name: Which checks this change needs
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | tee /dev/stderr | tools/changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'docs_only=false\ncode=true\nart=true\nintroducer=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  check:
    name: fmt, clippy (native + wasm32), tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.introducer == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version, targets and components in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: System libraries Bevy needs on Linux
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: check
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      # Lints: clippy's defaults plus the shared [workspace.lints] in Cargo.toml (no unsafe code, no dbg!/todo!/
      # unimplemented!, no unwrap() in crates/sim outside tests).
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: clippy (native, game + art tools)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The game only: the art tools never run in a browser.
      - name: clippy (wasm32)
        run: cargo clippy --all-targets --locked --target wasm32-unknown-unknown -- -D warnings
      # Includes the simulation's property tests (crates/sim/tests/properties.rs).
      - name: tests
        run: cargo test --workspace --locked
      # Known security advisories, licences, duplicate versions and sources of every dependency (deny.toml). Three
      # graphs: native PC, the browser, and the introducer (its own workspace and lock file).
      - name: cargo deny (native)
        run: cargo deny --workspace --locked check
      - name: cargo deny (wasm32)
        run: cargo deny --workspace --locked --target wasm32-unknown-unknown check
      - name: cargo deny (introducer)
        run: cargo deny --manifest-path tools/introducer/Cargo.toml --config deny.toml --locked check
      - name: tidy tool (fmt, clippy, tests)
        run: |
          cargo fmt --manifest-path tools/tidy/Cargo.toml --check
          cargo clippy --manifest-path tools/tidy/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path tools/tidy/Cargo.toml --locked

  determinism:
    name: native and wasm sims agree
    # The game rules must play out bit for bit the same natively and as WebAssembly (co-op and replays rely on it).
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version, targets and components in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: determinism
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasmtime
      - name: The simulation's tests (property tests too), as WebAssembly in wasmtime
        run: cargo test -p crabsim --locked --target wasm32-wasip1
      - name: Native and wasm runs match tick for tick, same state hash
        run: tools/determinism.sh

  art:
    name: committed art matches the rig
    # Re-runs the crab's and the creatures' art pipelines (rig -> parts SVG -> game atlas -> oil-painted atlas; all
    # deterministic) and fails if the committed files differ: art changes must come with their exports.
    # The oil atlases come out a few bits different on a Mac, so these Linux runs are the reference: on a
    # difference, the files as CI made them are uploaded (`art-as-ci-made-it`) to download and commit.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.art == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version, targets and components in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: art
      - name: Re-export the rigs and re-paint the oil atlases
        run: |
          cargo run --locked -q -p crabrig --profile art -- parts
          cargo run --locked -q -p crabrig --profile art -- export
          cargo run --locked -q -p crabrig --profile art -- parts --creature snapping-shrimp
          cargo run --locked -q -p crabrig --profile art -- export --creature snapping-shrimp
          cargo run --locked -q -p crabrig --profile art -- parts --creature snowflake-moray
          cargo run --locked -q -p crabrig --profile art -- export --creature snowflake-moray
          cargo run --locked -q -p crabrig --profile art -- parts --creature mantis-shrimp
          cargo run --locked -q -p crabrig --profile art -- export --creature mantis-shrimp
          cargo run --locked -q -p crabrig --profile art -- parts --creature common-octopus
          cargo run --locked -q -p crabrig --profile art -- export --creature common-octopus
          tools/paint-oil.sh
      - name: The committed art/crab, assets/crab, art/creatures and assets/creatures match
        run: |
          if [ -n "$(git status --porcelain -- art/crab assets/crab art/creatures assets/creatures)" ]; then
            git status --short -- art/crab assets/crab art/creatures assets/creatures
            echo "::error::The committed art differs from what the rigs export. Run the commands of the step above and commit the result (from a Mac, take the oil atlases from the art-as-ci-made-it artifact)."
            exit 1
          fi
      - name: Upload the art as CI made it
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: art-as-ci-made-it
          path: |
            art/crab
            assets/crab
            art/creatures
            assets/creatures

  web:
    name: web build, relaxed-SIMD check, size
    needs: changes
    # Also for an introducer change: the browser job's co-op scenarios play the game through it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.introducer == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version, targets and components in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - name: wasm-bindgen version from Cargo.lock
        id: wb
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }},wasm-tools
      - name: Install wasm-opt (binaryen ${{ env.BINARYEN_VERSION }})
        run: |
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o binaryen.tgz
          curl -fsSL "$url.sha256" -o binaryen.tgz.sha256
          echo "$(awk '{print $1}' binaryen.tgz.sha256)  binaryen.tgz" | sha256sum -c -
          tar -xzf binaryen.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          rm binaryen.tgz binaryen.tgz.sha256
      - name: Build the web game
        run: tools/build-web.sh
      - name: No relaxed SIMD (iPhone/WebKit rejects it)
        run: |
          wasm-tools validate --features=-relaxed-simd web/pkg/crabscape_bg.wasm
          wasm-tools validate --features=-relaxed-simd web/listen/listen_bg.wasm
      - name: Size report (information only)
        run: |
          {
            echo "### Web build size"
            echo "| File | Bytes | KiB | gzip KiB |"
            echo "|---|---:|---:|---:|"
            find web -type f | sort | while read -r f; do
              b=$(stat -c %s "$f"); g=$(gzip -9 -c "$f" | wc -c)
              echo "| \`$f\` | $b | $((b / 1024)) | $((g / 1024)) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the playable web/ folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crabscape-web-${{ github.sha }}
          path: web/
          retention-days: 14

  # The browser tests, fanned out: after the web build, WebKit portrait, WebKit landscape, the co-op scenarios in
  # parts and the frame strips all run at once on their own machines, from one build of the test tools. The
  # `browser` gate below carries the required check's name.
  browser-tools:
    name: browser test tools
    # webtest, cooptest and the introducer, built once while the web build runs, for the browser jobs below (which
    # then need no Rust at all). They find web/ and target/ at the same checkout path on every runner.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.introducer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version, targets and components in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: webtest
          workspaces: |
            . -> target
            tools/introducer -> target
      - name: Build the browser tests and the introducer
        run: |
          cargo build --profile art --locked -p webtest -p cooptest
          cargo build --release --locked --manifest-path tools/introducer/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-tools-${{ github.sha }}
          path: |
            target/art/webtest
            target/art/cooptest
            tools/introducer/target/release/introducer
          if-no-files-found: error
          retention-days: 3

  webkit:
    name: WebKit (${{ matrix.phone }} phone)
    # Plays the web build in WebKitGTK (the iPhone's engine) through WebDriver: tools/webtest.
    needs: [web, browser-tools]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.browser-tools.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - phone: portrait
            args: --shots target/webtest/portrait
          - phone: landscape
            args: --landscape --shots target/webtest/landscape
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WebKitGTK, its WebDriver and a virtual display
        # The WebDriver package is webkitgtk-webdriver since Ubuntu 26.04 (webkit2gtk-driver before).
        run: |
          sudo apt-get update -q
          pkgs=(libwebkit2gtk-4.1-0 libgl1-mesa-dri xvfb xauth dbus-x11)
          sudo apt-get install -yq --no-install-recommends webkitgtk-webdriver "${pkgs[@]}" \
            || sudo apt-get install -yq --no-install-recommends webkit2gtk-driver "${pkgs[@]}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crabscape-web-${{ github.sha }}
          path: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-tools-${{ github.sha }}
      - name: Play it in WebKit (${{ matrix.phone }} phone)
        run: |
          chmod +x target/art/webtest
          ulimit -c 0 && xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session -- target/art/webtest ${{ matrix.args }}
      - name: Keep the screenshots and browser log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webtest-${{ matrix.phone }}-${{ github.sha }}
          path: target/webtest/
          retention-days: 7

  coop:
    name: co-op promises, part ${{ matrix.part }} of ${{ strategy.job-total }}
    # Co-op in headless Chrome with a local introducer, each scenario once (docs/design/coop-promises.md;
    # tools/cooptest; coop.yml goes deeper on main). `--shard` splits the scenarios into parts of about equal time
    # and puts every scenario, a new one too, in exactly one part. Another part is one more number below.
    needs: [web, browser-tools]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.browser-tools.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crabscape-web-${{ github.sha }}
          path: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-tools-${{ github.sha }}
      - name: Co-op's promises in Chrome, two or three players, each scenario of this part once
        run: |
          chmod +x target/art/cooptest tools/introducer/target/release/introducer
          target/art/cooptest --repeat 1 --shard ${{ matrix.part }}/${{ strategy.job-total }} --logs target/webtest
      - name: Keep a failure's browser logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cooptest-part-${{ matrix.part }}-${{ github.sha }}
          path: target/webtest/
          retention-days: 7

  feel-strips:
    name: frame strips of a smash (to look at; never fails)
    # A smash in a few feel presets, as frame strips in the `webtest-feel` download. Information only: never fails
    # the run, and the `browser` gate doesn't wait for it.
    needs: [web, browser-tools]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.browser-tools.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WebKitGTK, its WebDriver and a virtual display
        run: |
          sudo apt-get update -q
          pkgs=(libwebkit2gtk-4.1-0 libgl1-mesa-dri xvfb xauth dbus-x11)
          sudo apt-get install -yq --no-install-recommends webkitgtk-webdriver "${pkgs[@]}" \
            || sudo apt-get install -yq --no-install-recommends webkit2gtk-driver "${pkgs[@]}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crabscape-web-${{ github.sha }}
          path: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-tools-${{ github.sha }}
      - name: Frame strips of a smash in a few feel presets
        run: |
          chmod +x target/art/webtest
          ulimit -c 0 && xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session -- target/art/webtest --feel-shots target/webtest/feel
      - name: Keep the frame strips
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webtest-feel-${{ github.sha }}
          path: target/webtest/
          retention-days: 7

  browser:
    name: browser test (WebKit, iPhone size)
    # The required check's name (branch protection asks for exactly this one), as a gate over the fanned-out browser
    # jobs: it passes only when the web build, the tools, both WebKit phones and every co-op part passed, or were
    # skipped (a change that can't affect the game). A failed or cancelled one fails it.
    needs: [web, browser-tools, webkit, coop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every browser job passed or was skipped
        env:
          RESULTS: web=${{ needs.web.result }} tools=${{ needs.browser-tools.result }} webkit=${{ needs.webkit.result }} coop=${{ needs.coop.result }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *=failure* | *=cancelled*) echo "::error::A browser job failed or was cancelled: $RESULTS"; exit 1 ;;
          esac

  mutants:
    name: mutation testing (changed lines)
    # cargo-mutants breaks each changed line of the game rules, the game's co-op code and the introducer in small ways
    # and fails if no test notices (tools/mutants-pr.sh, .cargo/mutants.toml). Pull requests only.
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.introducer == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Rust (the version, targets and components in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: System libraries Bevy needs on Linux (the game's co-op tests)
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants
          workspaces: |
            .
            tools/introducer
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants@27.1.0
      # In place (in this checkout, reusing the cached build) against the base the PR merges into.
      - name: Every mutant on the changed lines is caught
        run: tools/mutants-pr.sh HEAD^1 --in-place
      - name: Keep the mutants' logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ github.sha }}
          path: target/mutants-pr/
          retention-days: 14

  preview:
    name: playable preview
    # Publishes this run's web build (no second build) to its own folder on the Pages site: /pr-<n>/ for a pull
    # request, /branches/<name>/ for a run started by hand on another branch (gh workflow run ci.yml --ref <name>).
    # The link is commented on the PR. Removed when the PR closes (previews.yml). See tools/previews.sh.
    if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && !github.event.repository.private
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the folder to the gh-pages store
      pull-requests: write # keep one "Play this change" comment per PR
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FOLDER: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('branches/{0}', github.ref_name) }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crabscape-web-${{ github.sha }}
          path: web
      - name: Publish the folder to the store and refresh /builds/
        run: tools/previews.sh publish "$FOLDER" "$SHA"
      - name: Upsert the PR comment with the playable URL
        if: github.event_name == 'pull_request'
        run: tools/previews.sh comment "${{ github.event.number }}" "$FOLDER"
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ env.SHA }}
      - id: snap
        name: Assemble the site from the store
        run: tools/previews.sh snapshot site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.snap.outputs.deployed == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.snap.outputs.deployed == 'true'
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.snap.outputs.deployed == 'true'

  deploy:
    name: deploy to GitHub Pages
    # Pages for private repositories needs a paid plan, so only deploy when public.
    # (The private flag is read from the event, so a run started while private skips;
    # rerun with workflow_dispatch on main.)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: [check, determinism, art, web, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the main build to the gh-pages store
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crabscape-web-${{ github.sha }}
          path: web
      - name: Publish the main build to the preview store (gh-pages root)
        # The store is the source of truth: main at the root, previews in folders. Only a build that passed every
        # check gets here.
        run: tools/previews.sh publish-main
      - id: snap
        name: Assemble the site from the preview store
        run: tools/previews.sh snapshot site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.snap.outputs.deployed == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.snap.outputs.deployed == 'true'
        with:
          path: site
      - id: deployment
        if: steps.snap.outputs.deployed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: live site starts (after deploy)
    # Loads the deployed site in WebKit and checks the game starts with no errors (cargo webtest --smoke). A failure
    # here feeds the "main is broken" issue like any other.
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version, targets and components in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: WebKitGTK, its WebDriver and a virtual display
        # The WebDriver package is webkitgtk-webdriver since Ubuntu 26.04 (webkit2gtk-driver before).
        run: |
          sudo apt-get update -q
          pkgs=(libwebkit2gtk-4.1-0 libgl1-mesa-dri xvfb xauth dbus-x11)
          sudo apt-get install -yq --no-install-recommends webkitgtk-webdriver "${pkgs[@]}" \
            || sudo apt-get install -yq --no-install-recommends webkit2gtk-driver "${pkgs[@]}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: webtest
          save-if: false
      - name: Build the browser test
        run: cargo build --profile art --locked -p webtest
      - name: The live site starts in WebKit (a few tries while Pages catches up)
        run: |
          ulimit -c 0
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for try in 1 2 3; do
            xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session -- cargo webtest --url "$url" --smoke && exit 0
            echo "try $try failed; waiting for Pages"
            sleep 45
          done
          exit 1

  main-health:
    name: report main's health
    # On main only: a failure opens (or adds to) one "main is broken" issue for the next Claude; a green run closes it.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, check, determinism, art, web, browser, deploy, smoke]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open, update or close the "main is broken" issue
        run: tools/main-health.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
